<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- Glowing Box Stroke Gradient -->
    <linearGradient id="stroke-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bg-grad)" stroke="url(#stroke-grad)" stroke-width="12" />

  <!-- Inner Glowing AI Box Graphic (Isometric Cube & Neural Core) -->
  <g transform="translate(256, 256)">
    <!-- Ambient Core Glow -->
    <circle cx="0" cy="0" r="140" fill="url(#core-glow)" filter="url(#glow-filter)" />

    <!-- Isometric 3D Outer Cube Framework -->
    <!-- Top Face -->
    <polygon points="0,-120 100,-62 0,0 -100,-62" fill="none" stroke="url(#stroke-grad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Left Face -->
    <polygon points="-100,-62 0,0 0,116 -100,56" fill="none" stroke="url(#stroke-grad)" stroke-width="14" stroke-linejoin="round" />

    <!-- Right Face -->
    <polygon points="0,0 100,-62 100,56 0,116" fill="none" stroke="url(#stroke-grad)" stroke-width="14" stroke-linejoin="round" />

    <!-- Inner Floating Neural Node Core -->
    <polygon points="0,-48 40,-24 0,0 -40,-24" fill="#ffffff" opacity="0.9" />
    <polygon points="-40,-24 0,0 0,48 -40,24" fill="#38bdf8" opacity="0.85" />
    <polygon points="0,0 40,-24 40,24 0,48" fill="#818cf8" opacity="0.85" />

    <!-- Radiant Corner Dots -->
    <circle cx="0" cy="-120" r="8" fill="#ffffff" />
    <circle cx="100" cy="-62" r="8" fill="#38bdf8" />
    <circle cx="-100" cy="-62" r="8" fill="#38bdf8" />
    <circle cx="100" cy="56" r="8" fill="#818cf8" />
    <circle cx="-100" cy="56" r="8" fill="#818cf8" />
    <circle cx="0" cy="116" r="8" fill="#ffffff" />
  </g>
</svg>
